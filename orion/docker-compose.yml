services:
  mongo:
    image: mongo:6
    command: --nojournal
    ports:
      - "27017:27017"
  client:
    image: iot-isel/fiware-client
    ports:
      - "8081:8081"   
  orion:
    image: telefonicaiot/fiware-orion:latest
    depends_on:
      - mongo
      - client
    ports:
      - "10026:1026"
    command: -dbURI mongodb://mongo:27017 -logLevel DEBUG
    environment:
      - TZ=Europe/Lisbon
  node-red:
    image: nodered/node-red:latest
    links:
      - orion
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Lisbon